# arkenal.xyz: a static site (no Worker code). Deploy from this folder:
#   npx wrangler deploy
name = "arkenal"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "arkenal.xyz", custom_domain = true },
  { pattern = "www.arkenal.xyz", custom_domain = true },
]

[assets]
directory = "./public"
# /support serves support.html.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
