# Generates Arkenal.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is generated, so it isn't committed; edit this file instead.
name: Arkenal
options:
  bundleIdPrefix: com.snowlightlabs
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ArkenalKit:
    path: Packages/ArkenalKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: 64Y8XAN383
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Shared with the Files app extension. Mac app groups use the team prefix.
    ARKENAL_APP_GROUP: group.com.snowlightlabs.arkenal
    "ARKENAL_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)com.snowlightlabs.arkenal
    # Set to "-local" (with ARKENAL_APP_GROUP empty) for unsigned local Mac builds.
    ARKENAL_ENTITLEMENTS_SUFFIX: ""

targets:
  Arkenal:
    type: application
    platform: auto
    # One native SwiftUI target for iPhone, iPad and Mac (not Mac Catalyst).
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: ArkenalKit
      - target: ArkenalFiles
        embed: true
      - target: ArkenalShare
        embed: true
      - target: ArkenalWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_NAME: Arkenal
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightlabs.Arkenal
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Arkenal
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Progress of long backups and uploads on the Lock Screen (Settings can turn it off).
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings › Appearance › App Icon (iPhone and iPad; the Mac changes its Dock icon).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Snow AppIcon-Evergreen AppIcon-Harbor"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # On the Mac, selection highlights follow the accent color the user
        # picked in System Settings (as in Finder and Mail); Arkenal's accent is
        # applied explicitly through Theme.accent instead.
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME[sdk=macosx*]": ""
        CODE_SIGN_ENTITLEMENTS: Config/Arkenal-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Arkenal-macOS$(ARKENAL_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES

  # Shows a NAS in the Files app and Finder, when turned on in Settings › Privacy.
  ArkenalFiles:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FileProvider
        excludes: ["*.entitlements", "Info*.plist"]
    dependencies:
      - package: ArkenalKit
    settings:
      base:
        PRODUCT_NAME: ArkenalFiles
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightlabs.Arkenal.Files
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: FileProvider/Info.plist
        # Adds Finder's Keep Downloaded actions (Mac only).
        "INFOPLIST_FILE[sdk=macosx*]": FileProvider/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FileProvider/FileProvider-macOS$(ARKENAL_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # "Save to Arkenal" in the share sheet.
  ArkenalShare:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: ArkenalKit
    settings:
      base:
        PRODUCT_NAME: ArkenalShare
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightlabs.Arkenal.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ARKENAL_SHARE_EXTENSION_POINT: com.apple.share-services
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Share-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ShareExtension/Share-macOS$(ARKENAL_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # The Live Activity for long backups and uploads (iPhone and iPad).
  ArkenalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist"]
    dependencies:
      - package: ArkenalKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: ArkenalWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightlabs.Arkenal.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  Arkenal:
    build:
      targets:
        Arkenal: all
    run:
      # Test purchases of Arkenal Pro when run from Xcode.
      storeKitConfiguration: Config/Arkenal.storekit
    test:
      targets:
        - package: ArkenalKit/ArkenalKitTests

