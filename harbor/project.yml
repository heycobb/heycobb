# Generates Ownhold.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is generated, so it isn't committed; edit this file instead.
name: Ownhold
options:
  bundleIdPrefix: app.ownhold
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  OwnholdKit:
    path: Packages/OwnholdKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ownhold:
    type: application
    platform: auto
    # One native SwiftUI target for iPhone, iPad and Mac (not Mac Catalyst).
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: OwnholdKit
    settings:
      base:
        PRODUCT_NAME: Ownhold
        PRODUCT_BUNDLE_IDENTIFIER: app.ownhold.Ownhold
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ownhold
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # On the Mac, selection highlights follow the accent color the user
        # picked in System Settings (as in Finder and Mail); Ownhold's teal is
        # applied explicitly through Theme.accent instead.
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME[sdk=macosx*]": ""
        CODE_SIGN_ENTITLEMENTS: Config/Ownhold-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Ownhold-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Ownhold:
    build:
      targets:
        Ownhold: all
    test:
      targets:
        - package: OwnholdKit/OwnholdKitTests
