# Generates Ownhold.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is generated, so it isn't committed; edit this file instead.
name: Ownhold
options:
  bundleIdPrefix: app.ownhold
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  OwnholdKit:
    path: Packages/OwnholdKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Shared with the Files app extension. Mac app groups use the team prefix.
    OWNHOLD_APP_GROUP: group.app.ownhold.shared
    "OWNHOLD_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)app.ownhold.shared
    # Set to "-local" (with OWNHOLD_APP_GROUP empty) for unsigned local Mac builds.
    OWNHOLD_ENTITLEMENTS_SUFFIX: ""

targets:
  Ownhold:
    type: application
    platform: auto
    # One native SwiftUI target for iPhone, iPad and Mac (not Mac Catalyst).
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: OwnholdKit
      - target: OwnholdFiles
        embed: true
      - target: OwnholdShare
        embed: true
    settings:
      base:
        PRODUCT_NAME: Ownhold
        PRODUCT_BUNDLE_IDENTIFIER: app.ownhold.Ownhold
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ownhold
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings › Appearance › App Icon (iPhone and iPad; the Mac changes its Dock icon).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Paper AppIcon-Graphite AppIcon-Harbor"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # On the Mac, selection highlights follow the accent color the user
        # picked in System Settings (as in Finder and Mail); Ownhold's evergreen is
        # applied explicitly through Theme.accent instead.
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME[sdk=macosx*]": ""
        CODE_SIGN_ENTITLEMENTS: Config/Ownhold-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Ownhold-macOS$(OWNHOLD_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES

  # Shows a NAS in the Files app and Finder, when turned on in Settings › Privacy.
  OwnholdFiles:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FileProvider
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: OwnholdKit
    settings:
      base:
        PRODUCT_NAME: OwnholdFiles
        PRODUCT_BUNDLE_IDENTIFIER: app.ownhold.Ownhold.Files
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FileProvider/FileProvider-macOS$(OWNHOLD_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # "Save to Ownhold" in the share sheet.
  OwnholdShare:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: OwnholdKit
    settings:
      base:
        PRODUCT_NAME: OwnholdShare
        PRODUCT_BUNDLE_IDENTIFIER: app.ownhold.Ownhold.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        OWNHOLD_SHARE_EXTENSION_POINT: com.apple.share-services
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Share-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ShareExtension/Share-macOS$(OWNHOLD_ENTITLEMENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

schemes:
  Ownhold:
    build:
      targets:
        Ownhold: all
    test:
      targets:
        - package: OwnholdKit/OwnholdKitTests

